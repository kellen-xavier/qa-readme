name: Foco de Teste
on:
  push:
    paths: ['apps/foco_de_teste/**', '.github/workflows/foco-de-teste.yml']
  pull_request:
    paths: ['apps/foco_de_teste/**', '.github/workflows/foco-de-teste.yml']
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/foco_de_teste
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web
